<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy FLAC Player</title>

  <style>
    :root {
      --bg: #f7f2ea;
      --card: #fffaf2;
      --text: #231f20;
      --muted: #7c7067;
      --accent: #8f6f55;
      --accent-soft: #e6d3c2;
      --border: #eadfd2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151311;
        --card: #211d1a;
        --text: #f5eee7;
        --muted: #b8aaa0;
        --accent: #d3a477;
        --accent-soft: #3a2d24;
        --border: #332b25;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, var(--accent-soft), var(--bg) 45%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    .card {
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      backdrop-filter: blur(20px);
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cover {
      height: 280px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, var(--accent), transparent),
        linear-gradient(45deg, var(--accent-soft), var(--card));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -1.5px;
    }

    .muted {
      color: var(--muted);
    }

    audio {
      width: 100%;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .volume {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-size: 15px;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .section {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .track {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .track:hover {
      background: var(--accent-soft);
    }

    .track.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .track button {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .queue-item {
      padding: 12px;
      border-radius: 16px;
      background: var(--bg);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }

      .cover {
        height: 220px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card hero">
      <div class="cover">♪</div>

      <div>
        <p class="muted">Now Playing</p>
        <h1 id="nowTitle">No track selected</h1>
        <p id="nowArtist" class="muted">Choose a song from your library</p>
      </div>

      <div class="controls">
        <audio id="audio" controls></audio>

        <div class="volume">
          <span>Volume</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </section>

    <aside class="card">
      <h2>Library</h2>
      <p class="muted">Indexed from the data folder</p>

      <div class="section">
        <input id="search" class="search" placeholder="Search song, artist, or album..." />
        <div id="library"></div>
      </div>

      <div class="section">
        <h2>Queue</h2>
        <div id="queue"></div>
      </div>
    </aside>
  </main>

  <script>
const audio = document.getElementById("audio");
const volume = document.getElementById("volume");
const libraryEl = document.getElementById("library");
const queueEl = document.getElementById("queue");
const search = document.getElementById("search");
const nowTitle = document.getElementById("nowTitle");
const nowArtist = document.getElementById("nowArtist");

let tracks = [];
let queue = [];
let currentTrack = null;

/* ======================
   LOAD LIBRARY
====================== */
async function loadLibrary() {
  const res = await fetch("data/tracks.json");
  tracks = await res.json();

  const urlTrack = getURLParam("track");
  const autoplay = getURLParam("autoplay") === "1";

  if (urlTrack) {
    const found = tracks.find(t => t.src === urlTrack);
    if (found) {
      playTrack(found, autoplay);
    }
  }

  renderLibrary(tracks);
}

/* ======================
   URL HELPERS
====================== */
function getURLParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function generateShareLink(track) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?track=${encodeURIComponent(track.src)}&autoplay=1`;
}

/* ======================
   LIBRARY
====================== */
function renderLibrary(list) {
  libraryEl.innerHTML = "";

  list.forEach(track => {
    const item = document.createElement("div");
    item.className = "track" + (currentTrack?.src === track.src ? " active" : "");

    item.innerHTML = `
      <div>
        <strong>${track.title}</strong>
        <p class="muted">${track.artist || "Unknown Artist"} • ${track.album || "Unknown Album"}</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="add">Add</button>
        <button class="share">Share</button>
      </div>
    `;

    item.onclick = () => playTrack(track);

    item.querySelector(".add").onclick = e => {
      e.stopPropagation();
      queue.push(track);
      renderQueue();
    };

    item.querySelector(".share").onclick = e => {
      e.stopPropagation();
      shareTrack(track);
    };

    libraryEl.appendChild(item);
  });
}

/* ======================
   PLAYER
====================== */
function playTrack(track, autoplay = true) {
  currentTrack = track;

  audio.src = track.src;

  nowTitle.textContent = track.title;
  nowArtist.textContent = `${track.artist || "Unknown Artist"} • ${track.album || "Unknown Album"}`;

  renderLibrary(getFilteredTracks());

  if (autoplay) {
    audio.muted = true;

    audio.play()
      .then(() => {
        audio.muted = false;
      })
      .catch(() => {
        console.log("Autoplay still blocked");
      });
  }
}

/* ======================
   SHARE FUNCTION
====================== */
function shareTrack(track) {
  const link = generateShareLink(track);

  if (navigator.share) {
    navigator.share({
      title: track.title,
      text: `Listen: ${track.title}`,
      url: link
    });
  } else {
    navigator.clipboard.writeText(link);
    alert("Link copied to clipboard!");
  }
}

/* ======================
   QUEUE
====================== */
function renderQueue() {
  queueEl.innerHTML = queue.length
    ? queue.map(t => `<div class="queue-item">${t.title} — ${t.artist || "Unknown Artist"}</div>`).join("")
    : `<p class="muted">Queue is empty</p>`;
}

audio.addEventListener("ended", () => {
  const next = queue.shift();
  renderQueue();
  if (next) playTrack(next);
});

/* ======================
   SEARCH
====================== */
function getFilteredTracks() {
  const q = search.value.toLowerCase();

  return tracks.filter(track =>
    `${track.title} ${track.artist} ${track.album}`.toLowerCase().includes(q)
  );
}

search.addEventListener("input", () => {
  renderLibrary(getFilteredTracks());
});

/* ======================
   VOLUME
====================== */
volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

audio.volume = 0.8;

/* ======================
   INIT
====================== */
renderQueue();
loadLibrary();
</script>
</body>
</html>
