<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy FLAC Player</title>

<style>
:root {
  --bg: #f7f2ea;
  --card: #fffaf2;
  --text: #231f20;
  --muted: #7c7067;
  --accent: #8f6f55;
  --accent-soft: #e6d3c2;
  --border: #eadfd2;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151311;
    --card: #211d1a;
    --text: #f5eee7;
    --muted: #b8aaa0;
    --accent: #d3a477;
    --accent-soft: #3a2d24;
    --border: #332b25;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: radial-gradient(circle at top, var(--accent-soft), var(--bg) 45%);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 24px;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 1150px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.card {
  background: color-mix(in srgb, var(--card) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.12);
}

.cover {
  width: 100%;
  max-width: 260px;
  aspect-ratio: 1 / 1;
  margin: 0 auto 18px;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.2);
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1, h2, h3, p {
  margin: 0;
}

#nowTitle {
  font-size: 32px;
  margin-bottom: 8px;
}

#nowMeta {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 18px;
}

audio {
  width: 100%;
  margin-bottom: 16px;
}

.volume {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.search {
  width: 100%;
  padding: 13px 15px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  outline: none;
  margin: 16px 0;
}

.search:focus {
  border-color: var(--accent);
}

.track {
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.track:hover {
  background: var(--accent-soft);
}

.track.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.track-info {
  display: grid;
  gap: 5px;
}

.track-info span {
  color: var(--muted);
}

.track.active .track-info span {
  color: rgba(255,255,255,0.85);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.tags span {
  font-size: 11px;
  background: var(--accent-soft);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 999px;
}

.track.active .tags span {
  background: rgba(255,255,255,0.18);
  color: white;
  border-color: rgba(255,255,255,0.25);
}

.track-actions {
  display: flex;
  gap: 8px;
  align-items: start;
}

button {
  border: none;
  padding: 7px 10px;
  border-radius: 999px;
  cursor: pointer;
  background: var(--bg);
  color: var(--text);
}

button:hover {
  background: var(--accent);
  color: white;
}

.queue-item {
  background: var(--bg);
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--muted);
}

.empty {
  color: var(--muted);
  font-size: 14px;
}

@media (max-width: 850px) {
  .app {
    grid-template-columns: 1fr;
  }

  .cover {
  width: 100%;
  max-width: 320px;              /* prevents it from stretching wide */
  aspect-ratio: 2 / 3;           /* vertical portrait ratio */
  margin: 0 auto 18px;           /* center horizontally */
  border-radius: 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 64px;
}
}

.player-hero {
  position: relative;
  padding: 30px 0;
  border-radius: 26px;
  overflow: hidden;
}

/* 🔥 FULL WIDTH BLUR BACKGROUND */
.player-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--cover-url);
  background-size: cover;
  background-position: center;
  filter: blur(80px) brightness(0.4);
  transform: scale(1.2);
  z-index: 0;
}

/* dark overlay for readability */
.player-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent 40%, rgba(0,0,0,0.6));
  z-index: 0;
}

/* keep content above blur */
.player-hero > * {
  position: relative;
  z-index: 1;
}

.player-text {
  max-width: 260px;
  margin: 0 auto;           /* center with cover */
  padding: 0 12px;          /* 🔥 fixes left/right spacing */
  text-align: center;
}

#nowTitle {
  margin-top: 8px;
  margin-bottom: 6px;
}

#nowMeta {
  color: var(--muted);
  line-height: 1.6;
}

body {
  overflow: hidden;
}

.app {
  height: calc(100vh - 48px);
}

.card {
  min-height: 0;
}

aside.card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#library {
  flex: 1;
  overflow-y: auto;
  padding-right: 6px;
  margin-bottom: 16px;
}

#queue {
  max-height: 180px;
  overflow-y: auto;
  padding-right: 6px;
}

/* prettier scrollbar */
#library::-webkit-scrollbar,
#queue::-webkit-scrollbar {
  width: 8px;
}

#library::-webkit-scrollbar-thumb,
#queue::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 999px;
}

#library::-webkit-scrollbar-track,
#queue::-webkit-scrollbar-track {
  background: transparent;
}

@media (max-width: 850px) {
  body {
    overflow: auto;
  }

  .app {
    height: auto;
  }

  #library {
    max-height: 55vh;
  }

  #queue {
    max-height: 160px;
  }
}

@media (max-width: 850px) {
  .cover {
    aspect-ratio: auto;        /* 🔥 allow natural height */
    height: auto;
    max-height: 55vh;          /* prevent too tall */
  }

  .cover img {
    width: 100%;
    height: auto;              /* 🔥 no crop */
    object-fit: contain;
  }
}

@media (max-width: 850px) {
  .player-hero::before {
    filter: blur(60px) brightness(0.45);
    transform: scale(1.4);
  }
}

@media (max-width: 850px) {
  .player-hero {
    padding: 20px 12px;
  }
}
</style>
</head>

<body>

<main class="app">

  <section class="card">
    <div class="player-hero">
        <div class="cover" id="cover">♪</div>

        <div class="player-text">
            <h1 id="nowTitle">No track selected</h1>
            <p id="nowMeta">Choose a song</p>
        </div>

    </div>
    <audio id="audio" controls></audio>

    <div class="volume">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
  </section>

  <aside class="card">
    <h2>Library</h2>
    <p class="empty">Indexed from <code>data/tracks.json</code></p>

    <input id="search" class="search" placeholder="Search title, artist, album, genre...">

    <div id="library"></div>

    <h3>Queue</h3>
    <div id="queue"></div>
  </aside>

</main>

<script>
const audio = document.getElementById("audio");
const libraryEl = document.getElementById("library");
const queueEl = document.getElementById("queue");
const search = document.getElementById("search");
const nowTitle = document.getElementById("nowTitle");
const nowMeta = document.getElementById("nowMeta");
const volume = document.getElementById("volume");
const cover = document.getElementById("cover");

let tracks = [];
let queue = [];
let currentTrack = null;

function formatDuration(seconds) {
  if (!seconds) return "Unknown Length";

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60).toString().padStart(2, "0");

  return `${min}:${sec}`;
}

function formatBitrate(bitrate) {
  if (!bitrate) return "Unknown Bitrate";
  return `${Math.round(bitrate / 1000)} kbps`;
}

function getParam(name) {
  return new URLSearchParams(location.search).get(name);
}

function generateLink(track) {
  return location.origin + location.pathname +
    `?track=${encodeURIComponent(track.src)}&autoplay=1`;
}

async function loadLibrary() {
  tracks = await (await fetch("data/tracks.json")).json();

  const urlTrack = getParam("track");
  const autoplay = getParam("autoplay") === "1";

  if (urlTrack) {
    const found = tracks.find(track => track.src === urlTrack);
    if (found) playTrack(found, autoplay);
  }

  renderLibrary(tracks);
  renderQueue();
}

function renderLibrary(list) {
  libraryEl.innerHTML = "";

  list.forEach(track => {
    const item = document.createElement("div");
    item.className = "track" + (currentTrack?.src === track.src ? " active" : "");

    item.innerHTML = `
      <div class="track-info">
        <strong>${track.title || "Unknown Title"}</strong>
        <span>${track.artist || "Unknown Artist"} • ${track.album || "Unknown Album"}</span>

        <div class="tags">
          <span>${track.genre || "No Genre"}</span>
          <span>${track.date || "No Date"}</span>
          <span>${formatDuration(track.duration)}</span>
          <span>${formatBitrate(track.bitrate)}</span>
        </div>
      </div>

      <div class="track-actions">
        <button class="add">+</button>
        <button class="share">Share</button>
      </div>
    `;

    item.onclick = () => playTrack(track);

    item.querySelector(".add").onclick = e => {
      e.stopPropagation();
      addQueue(track);
    };

    item.querySelector(".share").onclick = e => {
      e.stopPropagation();
      shareTrack(track);
    };

    libraryEl.appendChild(item);
  });
}

function playTrack(track, autoplay = true) {
  currentTrack = track;
  audio.src = track.src;

  nowTitle.textContent = track.title || "Unknown Title";

  nowMeta.innerHTML = `
    ${track.artist || "Unknown Artist"} • ${track.album || "Unknown Album"}<br>
    ${track.genre || "No Genre"} • ${track.date || "No Date"} • ${formatDuration(track.duration)} • ${formatBitrate(track.bitrate)}
  `;

  const hero = document.querySelector(".player-hero");

if (track.cover) {
  hero.style.setProperty("--cover-url", `url('${track.cover}')`);
  cover.style.setProperty("--cover-url", `url('${track.cover}')`);
  cover.innerHTML = `<img src="${track.cover}" alt="Album cover">`;
} else {
  cover.style.removeProperty("--cover-url");
  cover.innerHTML = "♪";
}

  renderLibrary(filterTracks());

  if (autoplay) {
    audio.play().catch(() => {});
  }
}

function addQueue(track) {
  queue.push(track);
  renderQueue();
}

function renderQueue() {
  queueEl.innerHTML = queue.length
    ? queue.map(track => `<div class="queue-item">${track.title || "Unknown Title"} — ${track.artist || "Unknown Artist"}</div>`).join("")
    : `<p class="empty">Queue is empty</p>`;
}

audio.addEventListener("ended", () => {
  const next = queue.shift();
  renderQueue();

  if (next) playTrack(next);
});

function shareTrack(track) {
  const link = generateLink(track);

  if (navigator.share) {
    navigator.share({
      title: track.title || "Track",
      text: `Listen to ${track.title || "this track"}`,
      url: link
    });
  } else {
    navigator.clipboard.writeText(link);
    alert("Link copied!");
  }
}

function normalizeText(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  a = normalizeText(a);
  b = normalizeText(b);

  const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);

  for (let j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      matrix[i][j] = b[i - 1] === a[j - 1]
        ? matrix[i - 1][j - 1]
        : Math.min(
            matrix[i - 1][j - 1] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j] + 1
          );
    }
  }

  return matrix[b.length][a.length];
}

function fuzzyMatch(query, text) {
  query = normalizeText(query);
  text = normalizeText(text);

  if (!query) return true;
  if (text.includes(query)) return true;

  const words = text.split(" ");
  const queryWords = query.split(" ");

  return queryWords.every(qWord => {
    return words.some(word => {
      if (word.includes(qWord)) return true;

      const distance = levenshtein(qWord, word);
      const limit = qWord.length <= 4 ? 1 : 2;

      return distance <= limit;
    });
  });
}

function filterTracks() {
  const q = search.value;

  return tracks.filter(track => {
    const searchable = `
      ${track.title || ""}
      ${track.artist || ""}
      ${track.album || ""}
      ${track.genre || ""}
      ${track.date || ""}
      ${track.romaji || ""}
      ${track.search || ""}
    `;

    return fuzzyMatch(q, searchable);
  });
}

search.addEventListener("input", () => {
  renderLibrary(filterTracks());
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

audio.volume = 0.8;
loadLibrary();
</script>

</body>
</html>
