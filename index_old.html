<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy FLAC Player</title>

<style>
:root {
  --bg: #f7f2ea;
  --card: #fffaf2;
  --text: #231f20;
  --muted: #7c7067;
  --accent: #8f6f55;
  --accent-soft: #e6d3c2;
  --border: #eadfd2;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151311;
    --card: #211d1a;
    --text: #f5eee7;
    --muted: #b8aaa0;
    --accent: #d3a477;
    --accent-soft: #3a2d24;
    --border: #332b25;
  }
}

body {
  margin: 0;
  font-family: Inter, system-ui;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 24px;
}

.app {
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
}

.cover {
  height: 220px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
}

audio { width: 100%; }

.search {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}

.track {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  cursor: pointer;
}

.track:hover {
  background: var(--accent-soft);
}

.track.active {
  background: var(--accent);
  color: white;
}

.track-info { display: grid; gap: 4px; }

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tags span {
  font-size: 11px;
  background: var(--accent-soft);
  padding: 3px 6px;
  border-radius: 999px;
}

.track.active .tags span {
  background: rgba(255,255,255,0.2);
}

.queue-item {
  font-size: 13px;
  padding: 6px;
}

button {
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="app">

  <div class="card">
    <div class="cover">♪</div>

    <h2 id="nowTitle">No track</h2>
    <p id="nowMeta">Select a track</p>

    <audio id="audio" controls></audio>

    <div>
      Volume
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <div class="card">
    <input id="search" class="search" placeholder="Search...">

    <div id="library"></div>

    <h3>Queue</h3>
    <div id="queue"></div>
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const libraryEl = document.getElementById("library");
const queueEl = document.getElementById("queue");
const search = document.getElementById("search");
const nowTitle = document.getElementById("nowTitle");
const nowMeta = document.getElementById("nowMeta");
const volume = document.getElementById("volume");

let tracks = [];
let queue = [];
let currentTrack = null;

function formatDuration(s){
  if(!s) return "";
  let m=Math.floor(s/60);
  let sec=Math.floor(s%60).toString().padStart(2,"0");
  return `${m}:${sec}`;
}

function formatBitrate(b){
  if(!b) return "";
  return `${Math.round(b/1000)}kbps`;
}

function getParam(n){
  return new URLSearchParams(location.search).get(n);
}

function generateLink(track){
  return location.origin+location.pathname+
    `?track=${encodeURIComponent(track.src)}&autoplay=1`;
}

async function load(){
  tracks = await (await fetch("data/tracks.json")).json();

  let t = getParam("track");
  let auto = getParam("autoplay")==="1";

  if(t){
    let f = tracks.find(x=>x.src===t);
    if(f) play(f,auto);
  }

  render(tracks);
}

function render(list){
  libraryEl.innerHTML="";

  list.forEach(t=>{
    let div=document.createElement("div");
    div.className="track"+(currentTrack?.src===t.src?" active":"");

    div.innerHTML=`
      <div class="track-info">
        <strong>${t.title}</strong>
        <span>${t.artist} • ${t.album}</span>
        <div class="tags">
          <span>${t.genre||""}</span>
          <span>${t.date||""}</span>
          <span>${formatDuration(t.duration)}</span>
          <span>${formatBitrate(t.bitrate)}</span>
        </div>
      </div>
      <div>
        <button onclick="event.stopPropagation();addQ('${t.src}')">+</button>
        <button onclick="event.stopPropagation();share('${t.src}')">↗</button>
      </div>
    `;

    div.onclick=()=>play(t);

    libraryEl.appendChild(div);
  });
}

function play(t,auto=true){
  currentTrack=t;
  audio.src=t.src;

  nowTitle.textContent=t.title;
  nowMeta.innerHTML=
    `${t.artist} • ${t.album}<br>
     ${t.genre||""} • ${t.date||""} • ${formatDuration(t.duration)} • ${formatBitrate(t.bitrate)}`;

  render(filter());

  if(auto){
    audio.play().catch(()=>{});
  }
}

function addQ(src){
  let t=tracks.find(x=>x.src===src);
  queue.push(t);
  renderQ();
}

function renderQ(){
  queueEl.innerHTML = queue.map(t=>`<div class="queue-item">${t.title}</div>`).join("") || "Empty";
}

audio.onended=()=>{
  let n=queue.shift();
  renderQ();
  if(n) play(n);
};

function share(src){
  let t=tracks.find(x=>x.src===src);
  let link=generateLink(t);
  navigator.clipboard.writeText(link);
  alert("Copied!");
}

function filter(){
  let q=search.value.toLowerCase();
  return tracks.filter(t=>
    (t.title+t.artist+t.album).toLowerCase().includes(q)
  );
}

search.oninput=()=>render(filter());

volume.oninput=()=>audio.volume=volume.value;
audio.volume=0.8;

load();
</script>

</body>
</html>
